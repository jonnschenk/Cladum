<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cladum · Explorador de biodiversidad</title>
  <meta name="description" content="Cladum: explora especies, su clasificación y sus ocurrencias documentadas con datos verificables de GBIF.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Aplica el tema guardado antes de pintar para evitar parpadeo -->
  <script>
    try {
      const saved = localStorage.getItem('cladum:theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
  <div id="root">
    <!-- Arranque: visible antes de que cargue React; el primer render lo reemplaza -->
    <main class="page">
      <div class="boot" role="status">
        <svg class="loader loader--lg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path class="loader__branch" d="M2 12H7" pathLength="1" style="--step:0"/><path class="loader__branch" d="M7 6V18" pathLength="1" style="--step:1"/><path class="loader__branch" d="M7 6H13M7 18H13" pathLength="1" style="--step:2"/><path class="loader__branch" d="M13 3.5V8.5M13 15.5V20.5" pathLength="1" style="--step:3"/><path class="loader__branch" d="M13 3.5H21M13 8.5H21M13 15.5H21M13 20.5H21" pathLength="1" style="--step:4"/><circle class="loader__node" cx="21" cy="3.5" r="1.7" style="--step:5"/><circle class="loader__node" cx="21" cy="8.5" r="1.7" style="--step:5.5"/><circle class="loader__node" cx="21" cy="15.5" r="1.7" style="--step:6"/><circle class="loader__node" cx="21" cy="20.5" r="1.7" style="--step:6.5"/></svg>
        <p class="boot__text">Cargando Cladum…</p>
      </div>
    </main>
  </div>
</body>
</html>
